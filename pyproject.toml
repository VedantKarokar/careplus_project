[project]
name = "careplus_project"
version = "0.1.0"
description = "ETL pipeline with SQLAlchemy, MySQL, and Docker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "atlas-provider-sqlalchemy==0.5.0",
    "boto3==1.43.46",
    "botocore==1.43.46",
    "python-dotenv==1.2.2",
    "numpy>=2.5.1",
    "pandas==3.0.3",
    "pyarrow>=25.0.1",
    "pymysql>=1.2.0",
    "SQLAlchemy==2.0.51",
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
